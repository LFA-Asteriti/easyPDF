[package]
name = "easypdf-automation"
description = "Agent control for easyPDF: a headless tool set over the engine and an MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
easypdf-engine = { workspace = true }
easypdf-cos = { workspace = true }
easypdf-render = { workspace = true }
easypdf-organize = { workspace = true }
easypdf-platform = { workspace = true }
easypdf-prc = { workspace = true }
easypdf-prc-render = { workspace = true }
serde_json = { workspace = true }
ureq = "3.4"
url = "2.5"
sha2 = "0.11"
tempfile = "3.27"
base64 = "0.23"


[features]
default = ["mcp"]
# The MCP server module. Opt-in at run time either way; disable to leave it out of the build.
mcp = []

[dev-dependencies]
easypdf-fonts = { workspace = true }
png = "0.18"
flate2.workspace = true
easypdf-model = { workspace = true }
easypdf-xfa = { workspace = true }
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
rustix = { version = "1", features = ["fs"] }
