# Flatpak manifest for the single-file bundle attached to every GitHub release
# (easypdf-<version>-linux-<arch>.flatpak). Build it with packaging/linux/flatpak-bundle.sh.
#
# It repackages the release's own Linux tarball (easypdf-<version>-linux-<arch>.tar.gz, built on
# Ubuntu 22.04 by package.sh) instead of compiling Rust inside flatpak-builder: no network and no
# vendored crate sources during the build, a few seconds instead of 20+ minutes, and byte-for-byte
# the same binaries as the AppImage/deb/rpm. The script unpacks the tarball into `stage/` next to a
# copy of this file. The binaries need glibc >= 2.35 and load X11, Wayland, xkbcommon and Vulkan
# at runtime; the freedesktop runtime has all of them, and the GPU driver comes from its
# org.freedesktop.Platform.GL extension.
#
# it.twinba.easypdf.yml (same directory) is the from-source manifest for Flathub. Keep
# runtime-version and finish-args identical in both (packaging-lint checks this).
id: it.twinba.easypdf
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: easypdf
finish-args:
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for the wgpu renderer (Vulkan, or GL as a fallback).
  - --device=dri
  # Open/Save dialogs go through the file-chooser portal (rfd's xdg-portal backend) and
  # drag-and-drop through the document portal, so picked files work anywhere without broad
  # filesystem access. Documents and Downloads, where PDFs usually live, are granted so files
  # passed by path (the command line, Open Recent, "Save" next to the original) work there.
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  # Deliberately not granted: network (Flatpak installs update through flatpak, so Help ▸ Check
  # for updates reports that GitHub is unreachable; the optional --control channel listens on
  # 127.0.0.1 inside the sandbox) and home/host filesystem access. No CUPS socket either: printing
  # runs the `lp` command (crates/print), which the freedesktop runtime doesn't ship, so Print
  # reports that the spooler is unavailable until it goes through the print portal.
modules:
  - name: easypdf
    buildsystem: simple
    build-options:
      env:
        CRAFT_I18N_DIR: /run/build/easypdf/craft-i18n
    build-commands:
      - install -Dm755 bin/easypdf /app/bin/easypdf
      - install -Dm755 bin/easypdf-cli /app/bin/easypdf-cli
      - install -Dm644 share/applications/it.twinba.easypdf.desktop /app/share/applications/it.twinba.easypdf.desktop
      - install -Dm644 share/mime/packages/it.twinba.easypdf.xml /app/share/mime/packages/it.twinba.easypdf.xml
      # Already has the release's version and date substituted by package.sh.
      - install -Dm644 share/metainfo/it.twinba.easypdf.metainfo.xml /app/share/metainfo/it.twinba.easypdf.metainfo.xml
      # OCR models (with their licences), found at /app/bin/../share/easypdf/models.
      - mkdir -p /app/share/easypdf && cp -R share/easypdf/models /app/share/easypdf/
      # Licences, including the embedded craft-fonts' OFL texts.
      - mkdir -p /app/share/icons /app/share/doc && cp -R share/icons/hicolor /app/share/icons/ && cp -R share/doc/easypdf /app/share/doc/
    sources:
      - type: dir
        path: stage
      # Record the translation revision embedded in the prebuilt binaries.
      - type: git
        url: https://github.com/storytold/craft-i18n
        commit: 575cfdef63227b14daf173b8cc87928bfdfa325e
        dest: craft-i18n
