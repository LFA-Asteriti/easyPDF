# Builds and tests the workspace on FreeBSD, inside a FreeBSD VM on a Linux runner
# (GitHub has no FreeBSD runners). GPU tests skip themselves when the VM has no adapter.
name: FreeBSD

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - "**/Cargo.toml"
      - .github/workflows/freebsd.yml
      - packaging/freebsd/**
  workflow_dispatch:

concurrency:
  group: freebsd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freebsd:
    # Reviewed shared workflow pinned for this easyPDF release.
    uses: storytold/craft-common-actions/.github/workflows/freebsd.yml@91e2c7617393ce0dfbe67ef5daf7254ade368203
    with:
      # Empty explicitly disables the shared workflow's legacy font-repository checkout.
      craft-fonts-ref: ''
